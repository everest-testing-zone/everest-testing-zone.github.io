<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Documentation Versions</title>
    <!--
        Multiversion landing page.

        Deployed at the root of the docs repo (next to versions.json). Not tied
        to any particular instance build; fetches /versions.json at load time
        and renders the list dynamically, so the page never goes stale when an
        instance is added or removed.

        Styling reuses Furo's stylesheet from /latest/ — assumes at least one
        release has been deployed. Falls back to system styling otherwise.
    -->
    <link rel="icon" href="/latest/_static/favicon.png">
    <link rel="stylesheet" href="/latest/_static/styles/furo.css">
    <link rel="stylesheet" href="/latest/_static/styles/furo-extensions.css">
    <style>
        /* Furo's stylesheet assumes a sidebar+TOC layout that doesn't make
         * sense for a multiversion landing page. Reset to a centered column. */
        body { margin: 0; }
        .versions-page {
            max-width: 60rem;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }
        ul.versions-list { list-style: none; padding: 0; margin: 1.5em 0; }
        ul.versions-list li {
            padding: 0.6em 0;
            border-bottom: 1px solid var(--color-background-border, #e1e4e5);
        }
        ul.versions-list li a {
            font-size: 1.1em;
            text-decoration: none;
        }
        ul.versions-list li a:hover { text-decoration: underline; }
        ul.versions-list li.placeholder,
        ul.versions-list li.error {
            color: var(--color-foreground-secondary, #777);
            font-style: italic;
            border-bottom: none;
        }
    </style>
</head>
<body>
    <main class="versions-page">
        <h1>Documentation Versions</h1>
        <p>Pick a version of the documentation to view.</p>
        <ul class="versions-list" id="versions-list">
            <li class="placeholder">Loading&hellip;</li>
        </ul>
        <noscript>
            <p>JavaScript is required to render the list of available versions.
               You can browse <a href="/latest/">/latest/</a> directly.</p>
        </noscript>
    </main>
    <script>
        (function () {
            fetch('/versions.json')
                .then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                })
                .then(function (data) {
                    var list = document.getElementById('versions-list');
                    var versions = (data && data.versions) || [];
                    list.innerHTML = '';
                    if (versions.length === 0) {
                        var li = document.createElement('li');
                        li.className = 'placeholder';
                        li.textContent = 'No versions deployed yet.';
                        list.appendChild(li);
                        return;
                    }
                    versions.forEach(function (entry) {
                        var isObject = entry !== null && typeof entry === 'object';
                        var name = isObject ? entry.name : entry;
                        var display = isObject ? (entry.display || entry.name) : entry;
                        var li = document.createElement('li');
                        var a = document.createElement('a');
                        a.href = '/' + name + '/index.html';
                        a.textContent = display;
                        li.appendChild(a);
                        list.appendChild(li);
                    });
                })
                .catch(function (err) {
                    var list = document.getElementById('versions-list');
                    list.innerHTML =
                        '<li class="error">Failed to load version list.</li>';
                    console.error('versions_index: failed to load /versions.json', err);
                });
        })();
    </script>
</body>
</html>
